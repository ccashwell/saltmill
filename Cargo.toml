[package]
name = "saltmill"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Vanity address salt miner for CREATE2 and CREATE3 (CreateX) on the GPU and every CPU core, built for Apple silicon"
repository = "https://github.com/ccashwell/saltmill"
readme = "README.md"
keywords = ["create2", "create3", "createx", "vanity-address", "ethereum"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
getrandom = "0.2"
keccak-asm = "0.1"
ocl = { version = "0.19", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSArray"] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "MTLDevice",
    "MTLLibrary",
    "MTLComputePipeline",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLBuffer",
    "MTLResource",
    "MTLAllocation",
    "MTLTypes",
] }

[features]
# OpenCL GPU backend for non-Apple GPUs (needs an OpenCL ICD loader at link time)
opencl = ["dep:ocl"]

[profile.release]
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
codegen-units = 1
